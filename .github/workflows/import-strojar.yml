name: Import článkov z handballmalacky.sk (jednorazovo)
on:
  push:
    branches: [import-strojar]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Stiahnuť
        run: node scripts/import-strojar.mjs
      - name: Uložiť výsledok
        run: |
          git config user.name "import-bot"
          git config user.email "import-bot@users.noreply.github.com"
          git rm -rq --cached import-out 2>/dev/null; rm -rf import-out; git add -A aktuality-web.json archiv-web || true
          git commit -m "Výsledok importu [skip ci]" || echo "nič nové"
          git push
